# Reverse proxy for load tests: :8080 -> API on the host (:5030)
worker_processes auto;
events { worker_connections 16384; }

http {
  upstream api {
    server host.docker.internal:5030;
    keepalive 256; # reuse connections to the API instead of opening one per request
  }

  server {
    listen 80;

    # live seat map is a long-lived SSE stream: no buffering, no short timeout
    location ~ /seats/stream$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
